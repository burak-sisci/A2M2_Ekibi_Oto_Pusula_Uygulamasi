version: "3.9"

services:

  # ── MongoDB ───────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: otopusula-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otopusula-net
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: otopusula-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - otopusula-net
    restart: unless-stopped

  # ── RabbitMQ ──────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: otopusula-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - otopusula-net
    restart: unless-stopped

  # ── Python AI/ML Servisi ──────────────────────────────────────
  ai-service:
    build:
      context: ../ML_Model_V4
      dockerfile: Dockerfile
    container_name: otopusula-ai
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - otopusula-net
    restart: unless-stopped

  # ── .NET Backend API ──────────────────────────────────────────
  backend:
    build:
      context: ./backend.API
      dockerfile: Dockerfile
    container_name: otopusula-backend
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      CONNECTION_STRING: "mongodb://mongodb:27017/${DATABASE_NAME}"
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      ISSUER: ${ISSUER}
      AUDIENCE: ${AUDIENCE}
      EXPIRYMINUTES: ${EXPIRYMINUTES}
      REDIS_CONNECTION_STRING: "redis:6379,abortConnect=False"
      RABBITMQ_CONNECTION_STRING: "amqp://guest:guest@rabbitmq:5672/"
      FASTAPI_BASE_URL: "http://ai-service:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - otopusula-net
    restart: unless-stopped

networks:
  otopusula-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data:
